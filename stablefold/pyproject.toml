[build-system]
# CUDAExtension imports the exact runtime Torch ABI, so the sm_90a wheel is
# built with ``--no-build-isolation`` inside the pinned Python 3.14 /
# Torch 2.10 / CUDA 12.9 environment (see tools/build_sm90_wheel.sh).
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stablefold"
version = "0.1.0"
description = "StableFold: deterministic Hopper (sm_90a) Triangle Attention and Triangle Multiplicative Update kernels for AlphaFold3-style models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["torch>=2.8"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
# The DDP kernel preflight callback (stablefold.distributed) needs Lightning.
lightning = ["pytorch-lightning>=2.4"]
test = ["pytest>=8", "pytorch-lightning>=2.4"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["stablefold*"]

[tool.setuptools.package-data]
stablefold = ["*.cu", "*.json", "*.md", "_ext/*.so"]

[tool.ruff]
# Inherit the host repository's lint rules when vendored as a subdirectory.
extend = "../pyproject.toml"
line-length = 88
extend-exclude = ["integration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
