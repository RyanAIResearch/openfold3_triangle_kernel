# Binds every headline number to its code version, environment, and run
# directory. Update on every campaign; canonical_commit/tag advance only
# via explicit decision.
canonical_commit: TBD-post-terminology-pass  # tag iclr27-stablefold-rc1 at freeze
base_commit: a94b9562e
branch: sr/dq-warpgroup
worktree: /home/ubuntu/xzz/of3_sr_dq
tags:
  sr-v1-classic-delta: 76ab6493d   # PRE-FENCE; historical (F2 ladder only)
  sr-v2-shadow-delta: f284f6133    # PRE-FENCE; historical (F2 ladder only)
environment:
  gpu: H100-80GB (single)
  driver: 570.195.03
  cuda_torch: "12.9"
  torch: 2.10.0
  python: 3.14.6
  arch_flags: TORCH_CUDA_ARCH_LIST=9.0a
  pixi_env: openfold3_workspace/src/.pixi/envs/openfold3-cuda12
